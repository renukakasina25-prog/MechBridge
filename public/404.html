<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MechBridge</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g., https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the route part and not the real directory.
      // This script will also work with any subdirectory, for example:
      // https://www.foo.tld/bar/one/two?a=b&c=d#qwe becomes
      // https://www.foo.tld/bar/?/one/two&a=b~and~c=d#qwe
      // However, if your site is in a subdirectory and you use pathSegmentsToKeep = 1,
      // then the virtual subdirectory (bar in this example) must be in the URL.
      // If your site is at https://www.foo.tld/bar/, then the URL
      // https://www.foo.tld/bar/one/two?a=b&c=d#qwe becomes
      // https://www.foo.tld/bar/?/one/two&a=b~and~c=d#qwe
      // Otherwise, the virtual subdirectory (bar) will be missing.
      // If your site is at https://www.foo.tld/, then the URL
      // https://www.foo.tld/one/two?a=b&c=d#qwe becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // If you're using a custom domain, set pathSegmentsToKeep to 0.
      // If your site is at https://foo.github.io/bar/, then the URL
      // https://foo.github.io/bar/one/two?a=b&c=d#qwe becomes
      // https://foo.github.io/bar/?/one/two&a=b~and~c=d#qwe
      // If your site is at https://foo.github.io/, then the URL
      // https://foo.github.io/one/two?a=b&c=d#qwe becomes
      // https://foo.github.io/?/one/two&a=b~and~c=d#qwe
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );

    </script>
  </head>
  <body>
  </body>
</html>
